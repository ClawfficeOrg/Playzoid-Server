[package]
name = "playzoid_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-actors = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.10"
actix = "0.13"
chrono = { version = "0.4", features = ["serde", "alloc"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
