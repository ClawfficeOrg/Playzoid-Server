[package]
name = "playzoid_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-actors = "4"
actix = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
chrono = { version = "0.4", features = ["serde", "alloc"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1.18.0"
url = "2.4.0"

# Phase 0.2 prerequisites — wired in but not yet referenced in code.
# Each subsequent recovery task (R-6..R-9 and Phase 0.2 tasks) consumes these.
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "macros", "chrono", "uuid", "migrate"] }
jsonwebtoken = "9"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
dotenvy = "0.15"
argon2 = "0.5"
thiserror = "1"
anyhow = "1"
validator = { version = "0.18", features = ["derive"] }
